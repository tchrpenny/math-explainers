<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Explainers</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #F6F7F9; --card: #FFFFFF; --ink: #1B2433; --soft: #55607A; --line: #DDE2EA; --accent: #0F766E;
    --font: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --card: #1B2434; --ink: #EEF1F6; --soft: #A9B3C7; --line: #2E3950; --accent: #4FD1C5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.5; padding: 28px 16px 40px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: clamp(1.7rem, 4.5vw, 2.3rem); margin: 0 0 6px; letter-spacing: -0.01em; }
  .lede { color: var(--soft); margin: 0 0 22px; max-width: 60ch; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  a.card { display: block; text-decoration: none; color: inherit; background: var(--card); border: 2px solid var(--line); border-left: 6px solid var(--accent); border-radius: 14px; padding: 14px 16px; }
  a.card:hover { border-color: var(--accent); }
  a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  a.card b { display: block; font-size: 1.08rem; margin-bottom: 4px; }
  a.card span { color: var(--soft); font-size: .92rem; }
  .empty { color: var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Math Explainers</h1>
  <p class="lede">Interactive explainers for teachers. Pick one to open it.</p>
  <div class="list" id="list"></div>
</div>

<script>
/* ===== TO ADD A NEW EXPLAINER =====
   1. Upload the new .html file to this repository.
   2. Copy one line below, paste it under the last one, and change the three parts:
      title, file (the exact filename), and description.
   3. Keep a comma at the end of every line except you can leave it on the last one too.
*/
var explainers = [
  { title: "Try–Discuss–Connect", file: "tdc-grade3.html", description: "How the i-Ready routine runs in grades 2–5, with a sample lesson to click through." }
];
/* ===== END OF LIST ===== */

var list = document.getElementById("list");
if (!explainers.length) {
  list.innerHTML = '<p class="empty">No explainers yet.</p>';
} else {
  explainers.forEach(function (e) {
    var a = document.createElement("a");
    a.className = "card";
    a.href = e.file;
    var b = document.createElement("b");
    b.textContent = e.title;
    var s = document.createElement("span");
    s.textContent = e.description;
    a.appendChild(b);
    a.appendChild(s);
    list.appendChild(a);
  });
}
</script>
</body>
</html>
